<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeCaf design previews</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font-family:var(--font-sans,system-ui);color:var(--foreground,#222)}button,input,select{font:inherit}button,summary,select{cursor:pointer}button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #a0673a;outline-offset:3px}[hidden]{display:none!important}
.gallery-tools{display:flex;gap:8px;align-items:center;margin-bottom:14px}.gallery-tools select{min-width:0;flex:1;padding:12px;border:1px solid var(--border,#ccc);border-radius:8px;background:var(--background,#fff);color:inherit;font-size:14px}.gallery-tools button{width:44px;height:44px;border:1px solid var(--border,#ccc);background:transparent;color:inherit;border-radius:8px}.gallery-tools button:disabled{opacity:.3;cursor:default}.intro{font-size:14px;line-height:1.5;margin:0 0 18px;color:var(--muted-foreground,#777)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}.column{min-width:0}.label{font-size:12px;font-weight:600;margin:0 0 8px;color:var(--muted-foreground,#777)}.foot{font-size:12px;line-height:1.5;color:var(--muted-foreground,#777);margin:14px 0 0}
.dc{--paper:#f3efea;--ink:#29231f;--muted:#746a61;--rule:#ded6cc;--coffee:#8a552d;--white:#fff;--soft:#ebe0d2;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,sans-serif;border-radius:var(--radius,12px);padding:20px;overflow:hidden;min-width:0}.dc p,.dc h2,.dc h3{margin:0}.dc h2{font-size:24px;line-height:1.18;letter-spacing:-.6px}.dc h3{font-size:16px;line-height:1.35}.dc small,.dc .muted{font-size:12px;color:var(--muted)}.dc .brand{display:flex;gap:9px;align-items:center;font-size:19px;font-weight:750;padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:20px}.dc .brand img{width:27px;height:27px;border-radius:6px}.dc .brand .section{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto}.dc .subtitle{margin:7px 0 22px;color:var(--muted);font-size:13px}.dc .panel{padding:16px;background:var(--white);border-radius:12px;margin-bottom:14px}.dc .line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}.dc .line:last-child{border-bottom:0}.dc .metric{font-size:30px;font-weight:700;letter-spacing:-1px}.dc .unit{font-size:14px;font-weight:500;letter-spacing:0}.dc .action{display:block;padding:10px 14px;min-height:42px;border:0;border-radius:7px;background:var(--coffee);color:white;font-weight:650;font-size:13px}.dc .quiet{color:var(--coffee);background:transparent;border:0;font-weight:600;padding:8px 0;font-size:13px}.dc .kicker{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}.dc .schedule{display:grid;grid-template-columns:76px 1fr;gap:18px 12px;margin:22px 0}.dc .schedule time{color:var(--coffee);font-size:13px;font-weight:650;padding-top:3px}.dc .schedule strong{font-size:21px;line-height:1.2;display:block}.dc .schedule small{display:block;margin-top:4px}.dc .summary{padding:15px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:16px 0}.dc details{margin-top:16px}.dc summary{font-size:13px;color:var(--coffee);font-weight:600;min-height:28px}.dc details p{margin-top:10px}.dc .nav{display:flex;border-top:1px solid var(--rule);margin-top:22px;padding-top:8px;gap:4px}.dc .nav button{flex:1;min-width:0;background:none;border:0;color:var(--muted);padding:12px 4px;font-size:13px;min-height:44px}.dc .nav button[aria-selected="true"]{color:var(--coffee);font-weight:700;border-top:2px solid var(--coffee)}.dc .tag{background:#e3ecdf;color:#435d3b;font-size:11px;border-radius:20px;padding:5px 8px;white-space:nowrap}.dc .formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.dc label{display:block;font-size:12px;color:var(--muted)}.dc input,.dc select{width:100%;min-width:0;margin-top:5px;border:1px solid var(--rule);padding:9px 7px;border-radius:7px;color:var(--ink);background:var(--white);font-size:14px}.dc .ghostfield{display:block;padding:10px 9px;background:#f0ede9;border:1px solid #e1d9d0;border-radius:12px;color:#29231f;font-size:13px;margin-top:6px}.dc .divider{border:0;border-top:1px solid var(--rule);margin:18px 0}.dc .chart{display:block;width:100%;height:200px;margin-top:16px}.dc .chart text{font:11px system-ui;fill:var(--muted)}.dc .chart path.curve{stroke:#a0673a;fill:none;stroke-width:2.5}.dc .chart line{stroke:var(--rule);stroke-width:1}.dc .ratings{display:flex;gap:7px;margin-top:14px}.dc .ratings button{flex:1;min-width:0;min-height:42px;background:white;color:var(--ink);border:1px solid var(--rule);border-radius:6px}.dc .ratings button[aria-pressed="true"]{background:var(--coffee);color:white;border-color:var(--coffee)}.dc .ends{display:flex;justify-content:space-between;margin-top:5px}.dc .inline-rating{margin-top:22px;border-top:1px solid var(--rule);padding-top:18px}.dc .receipt{padding:13px 0;border-bottom:1px solid var(--rule);display:flex;gap:16px;align-items:baseline}.dc .receipt strong{display:block}.dc .receipt time{color:var(--muted);font-size:12px;min-width:56px}
.legacy{background:#f1eeeb;padding:16px}.legacy .brand{background:linear-gradient(135deg,#a0673a,#bfa28b);border:0;border-radius:16px 16px 28px 28px;padding:16px;margin:-0px -0px 16px;color:white;font-size:26px;display:block}.legacy .brand .section{display:block;color:#f3e8de;margin-top:4px;font-size:13px}.legacy .panel{border-radius:26px;padding:18px;box-shadow:0 12px 22px -18px #54413133;margin-bottom:16px}.legacy .ringgroup{display:flex;align-items:center;gap:12px}.legacy .ring{width:112px;height:112px;flex:none;border-radius:50%;background:#a0673a;border:6px solid #a0673a;box-shadow:inset 0 0 0 4px #f7ede1;color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.15}.legacy .ring b{font-size:34px}.legacy .ring small{color:white;text-align:center;font-size:10px;margin-top:4px}.legacy .nav{border:0;background:#17221d;border-radius:20px;padding:7px 3px;gap:0}.legacy .nav span{flex:1;text-align:center;color:#b8bcb8;font-size:9px;padding:8px 1px}.legacy .nav span.active{color:#d9b491}.legacy .pill{background:#efede9;padding:5px 9px;border-radius:30px;font-size:11px}.legacy .slider{height:6px;background:linear-gradient(to right,#a0673a 35%,#dedbd7 35%);border-radius:10px;margin:14px 0 22px}.legacy .ringgroup .muted{font-size:12px}.legacy .fold{border-top:1px dashed #c9bdae;margin-top:18px;padding-top:12px;color:#837367;font-size:11px}.legacy .prompt{position:absolute;left:10px;right:10px;bottom:18px;padding:15px;background:white;border-radius:22px;box-shadow:0 3px 17px #0003;display:flex;align-items:center;gap:10px;font-size:12px}.legacy .prompt b{display:block}.legacy .prompt button{border:0;border-radius:20px;background:#a0673a;color:white;padding:8px 12px}.dc .slots{display:grid;grid-template-columns:1fr 1fr;gap:16px}.dc .target{border-left:3px solid var(--coffee);padding:3px 0 3px 13px;margin:22px 0}.dc .target strong{display:block;font-size:17px}.dc .linked{font-size:11px;color:var(--coffee);margin-top:4px}.dc .detail-note{font-size:12px;color:var(--muted);margin-top:14px}.desktop .brand{margin-bottom:22px}.desktop .deskgrid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px}.desktop .chart{height:240px}.desktop .deskplan{border-right:1px solid var(--rule);padding-right:22px}.desktop .desklinks{display:flex;gap:20px;margin-left:auto;font-size:13px;font-weight:500}.desktop .desklinks strong{color:var(--coffee)}.desktop .brand .section{margin-left:0}.space-demo{background:#ddd6cf;padding:20px;border-radius:var(--radius,12px)}.space-demo .mini-phone{max-width:220px;margin:auto;border:7px solid #2a211b;border-radius:30px;overflow:hidden;background:#f1eeeb;padding:14px;color:#29231f;font:12px/1.5 system-ui}.space-demo .mini-phone b{font-size:18px}.space-demo .mini-block{background:white;border-radius:18px;margin:12px 0;padding:12px}.space-demo .mini-circle{border-radius:50%;background:#a0673a;color:white;width:70px;height:70px;display:grid;place-items:center;margin:0 auto 12px;font-size:24px}.desktop-view-switch{display:flex;gap:8px;margin-bottom:12px}.desktop-view-switch button{background:transparent;color:var(--foreground);border:1px solid var(--border);padding:9px 13px;border-radius:7px;font-size:13px}.desktop-view-switch button[aria-pressed="true"]{background:var(--primary,#222);color:var(--primary-foreground,#fff)}
@media(max-width:580px){.compare{grid-template-columns:1fr}.dc{padding:18px}.legacy{padding:16px}.desktop .deskgrid{grid-template-columns:1fr;gap:20px}.desktop .deskplan{border-right:0;border-bottom:1px solid var(--rule);padding:0 0 18px}.desktop .desklinks{gap:12px}.dc .slots{grid-template-columns:1fr}.gallery-tools select{font-size:13px}.desktop .brand img{display:none}.desktop .chart{height:210px}}
</style></head><body>
<main id="decaf-gallery">
<div class="gallery-tools"><button id="previous" aria-label="Previous suggestion">←</button><select id="example" aria-label="Choose a design suggestion"><option value="0">1 · Put the plan first</option><option value="1">2 · Simplify navigation</option><option value="2">3 · Calm the visual styling</option><option value="3">4 · Share one event date</option><option value="4">5 · Make estimates explicit</option><option value="5">6 · Keep ratings inline</option><option value="6">7 · Use the desktop width</option></select><button id="next" aria-label="Next suggestion">→</button></div>
<p class="intro" id="description" aria-live="polite"></p>
<div id="stage"></div>
<p class="foot">Design concepts, not changes to the app. “Current” views are simplified reconstructions. Numbers reuse the reviewed sample; curves are schematic.</p>
</main>
<script>
const root=document.getElementById('decaf-gallery');
const brand=(section,legacy=false)=>legacy?`<div class="brand">DeCaf<span class="section">${section}</span></div>`:`<div class="brand"><img src="/Users/andrew/Documents/hackathon/frontend/icons/logo.svg" alt=""><span>DeCaf</span><span class="section">${section}</span></div>`;
const oldNav=()=>`<div class="nav"><span>Caffeine</span><span>Sleep</span><span>Tolerance</span><span>Alertness</span><span class="active">Plan</span><span>Learn</span></div>`;
const plan=()=>`<div class="schedule"><time>8:30 AM</time><div><strong>150 mg caffeine</strong><small>About 1.5 cups of drip coffee</small></div><time>9:00 AM</time><div><strong style="font-size:16px">Your event</strong><small>Until 11 AM</small></div></div>`;
const bed=()=>`<div class="summary"><p>Estimated at bedtime: <strong>22 mg</strong></p><small>Below the model’s 50 mg threshold.</small></div>`;
const oldRing=()=>`<div class="panel ringgroup"><div class="ring"><b>7.9</b><small>out of 10<br>at your event</small></div><div><strong>Alertness during your event</strong><p class="muted">6.4 → 7.9 out of 10.</p></div></div>`;
const eventForm=()=>`<div class="panel"><h3>Your event</h3><div class="formrow"><div><small>Day</small><span class="ghostfield">2026-10-19</span></div><div><small>Starts</small><span class="ghostfield">09:00 AM</span></div></div><div class="line" style="padding:0;border:0"><span>Lasts</span><strong>2 h</strong></div><div class="slider"></div><p>☑ A nap is OK</p><div class="formrow"><div><small>Free from</small><span class="ghostfield">— : —</span></div><div><small>Until</small><span class="ghostfield">— : —</span></div></div><small>Optional. When a nap could fit.</small></div>`;
const chart=(id)=>`<svg class="chart" data-chart="${id}" role="img" aria-label="Schematic caffeine curve, with caffeine in milligrams vertically and time horizontally"></svg>`;
const comparison=(before,after)=>`<div class="compare"><section class="column"><p class="label">CURRENT PATTERN</p><div class="dc legacy">${before}</div></section><section class="column"><p class="label">PROPOSED</p><div class="dc">${after}</div></section></div>`;
const pages=[
{description:'Put the dose and time above the event form. Keep the model score available under “Why this plan?”',render:()=>comparison(brand('Your caffeine plan',true)+oldRing()+eventForm()+`<p class="fold">The actual schedule begins below the first view ↓</p>`,brand('Plan')+`<h2>For your 9 AM event</h2><p class="subtitle">Mon, Oct 19 · 9–11 AM</p>`+plan()+bed()+`<details><summary>Edit event details</summary><div class="formrow"><label>Day<input type="date" value="2026-10-19"></label><label>Starts<input type="time" value="09:00"></label></div><small>Layout demo only; changes do not recalculate a plan.</small></details><details><summary>Why this plan?</summary><p>Predicted alertness: <strong>6.4 → 7.9 / 10</strong></p><p class="muted">A model estimate based on your sleep and caffeine history.</p></details>`)},
{description:'Organize around Today, Plan, and Insights. Try the three tabs; the mathematical layers remain accessible inside Insights.',render:()=>comparison(brand('Caffeine in your blood',true)+`<div class="panel"><h3>Caffeine over the day</h3><p class="metric" style="margin-top:12px">80 <span class="unit">mg right now</span></p>${chart('old-nav')}</div>`+oldNav()+`<p class="detail-note">Six destinations share the same visual weight.</p>`,brand('Your day')+`<div id="nav-content"></div><nav class="nav" aria-label="Example app navigation"><button data-nav="today" aria-selected="true">Today</button><button data-nav="plan" aria-selected="false">Plan</button><button data-nav="insights" aria-selected="false">Insights</button></nav>`)},
{description:'Keep the coffee colors and the same content. Use a flat header, quieter containers, and fewer pill shapes.',render:()=>comparison(brand('Caffeine in your blood',true)+`<div class="panel"><div class="line" style="padding-top:0;border:0"><h3>Today</h3><span class="pill">mg · mg/L</span></div><p class="metric">80 <span class="unit">mg right now</span></p>${chart('soft')}</div><div class="panel"><div class="line" style="padding:0;border:0"><h3>Sleep check</h3><span class="tag">Fine for sleep</span></div><small>37 mg left at 11 PM</small></div>`,brand('Today')+`<h2>Caffeine today</h2><p class="subtitle">Sun, Oct 18</p><p class="metric">80 <span class="unit">mg right now</span></p>${chart('flat')}<div class="summary"><h3>At bedtime</h3><p style="margin-top:8px">37 mg estimated at 11 PM</p><small>Below the model’s 50 mg threshold.</small></div>`)},
{description:'One event feeds both screens. Change the date below to see both references update together; this preview only demonstrates shared state.',render:()=>`<div class="dc">${brand('Event settings')}<h2>Your event</h2><div class="formrow"><label>Event date<input id="shared-date" type="date" value="2026-10-19"></label><label>Start time<input id="shared-time" type="time" value="09:00"></label></div><p class="muted">Duration: 2 hours</p><hr class="divider"><div class="slots"><section><p class="kicker">Plan</p><h3>Your caffeine schedule</h3><div class="target"><strong class="shared-date-text"></strong><span class="shared-time-text"></span><p class="linked">Uses your saved event</p></div><p class="detail-note">Dose timing is calculated for this event.</p></section><section><p class="kicker">Tolerance</p><h3>Reset before your event</h3><div class="target"><strong class="shared-date-text"></strong><span class="shared-time-text"></span><p class="linked">Uses your saved event</p></div><p class="detail-note">Reset options are calculated for the same date.</p></section></div><details><summary>Planning a separate long-term reset?</summary><label style="margin-top:12px">Separate reset target<input type="date" value="2026-11-01"></label><p class="muted">Keep this explicitly separate from your event.</p></details></div>`},
{description:'Place uncertainty beside the result. Use plain labels instead of a reassuring badge or an unexplained percentage.',render:()=>comparison(brand('Your results',true)+`<div class="panel"><div class="line" style="padding:0 0 12px;border:0"><h3>Sleep check</h3><span class="tag">Fine for sleep</span></div><p>37 mg left at 11:00 PM</p><small>Under the 50 mg cutoff.</small></div><div class="panel"><p class="metric">17%</p><p>coffee strength</p><h3 style="margin-top:16px">Your 95 mg feels like 17 mg</h3><p class="muted" style="margin-top:8px">1.49x a non-drinker’s receptors</p></div>`,brand('Estimates')+`<p class="kicker">Bedtime · model estimate</p><p class="metric">37 <span class="unit">mg at 11 PM</span></p><p style="margin-top:10px">Below the model’s 50 mg threshold.</p><p class="detail-note">Your sleep response may differ.</p><hr class="divider"><p class="kicker">Tolerance · model estimate</p><h3>Reduced effect from daily use</h3><p style="margin-top:12px">A 95 mg dose has an estimated effect similar to 17 mg without tolerance.</p><details><summary>See the assumptions</summary><p class="muted">This estimate uses the tolerance model and your reported caffeine habit. It does not measure your receptors.</p></details>`)},
{description:'Ask for a rating inside the drink log, without covering it. Try selecting a rating in the proposed version.',render:()=>comparison(brand('Your drinks today',true)+`<div style="position:relative;padding-bottom:32px"><div class="panel"><h3>Your drinks today</h3><div class="formrow"><div><small>Time</small><span class="ghostfield">08:00 AM</span></div><div><small>Drink</small><span class="ghostfield">Drip coffee</span></div></div><div class="formrow"><div><small>Time</small><span class="ghostfield">01:00 PM</span></div><div><small>Drink</small><span class="ghostfield">Drip coffee</span></div></div><span class="quiet">+ Add a drink</span></div><div class="prompt"><div><b>How alert are you right now?</b><small>Rate it every hour so DeCaf learns your half-life.</small></div><button disabled>Rate</button><span>×</span></div></div>`+oldNav(),brand('Today')+`<h2>Your drinks</h2><div class="receipt"><time>8 AM</time><div><strong>Drip coffee</strong><small>95 mg · 8 oz</small></div></div><div class="receipt"><time>1 PM</time><div><strong>Drip coffee</strong><small>95 mg · 8 oz · planned</small></div></div><details><summary>+ Add a drink</summary><div class="formrow"><label>Time<input type="time" value="14:00"></label><label>Caffeine, mg<input type="number" value="95"></label></div><small>Example form; not saved to your app.</small></details><div class="inline-rating"><h3>How alert do you feel?</h3><p class="muted" style="margin-top:6px">Optional. Your ratings help refine the model.</p><div class="ratings" aria-label="Example alertness rating">${[1,2,3,4,5].map(n=>`<button data-rating="${n}" aria-pressed="false">${n}</button>`).join('')}</div><div class="ends"><small>Exhausted</small><small>Fully alert</small></div><p id="rating-status" class="detail-note" aria-live="polite">No rating selected.</p></div>`)},
{description:'Let the schedule and chart share the screen on a laptop. Switch views to compare the use of space; the proposed layout stacks on phones.',render:()=>`<div class="desktop-view-switch" aria-label="Desktop layout comparison"><button data-desktop="proposed" aria-pressed="true">Proposed desktop</button><button data-desktop="current" aria-pressed="false">Current phone frame</button></div><div id="desktop-proposed" class="dc desktop"><div class="brand"><img src="/Users/andrew/Documents/hackathon/frontend/icons/logo.svg" alt=""><span>DeCaf</span><div class="desklinks"><span>Today</span><strong>Plan</strong><span>Insights</span></div></div><h2>Your event plan</h2><p class="subtitle">Mon, Oct 19 · 9–11 AM</p><div class="deskgrid"><section class="deskplan"><p class="kicker">Schedule</p>${plan()}<details><summary>Event &amp; sleep settings</summary><p class="muted">Event 9–11 AM<br>Bedtime 11 PM</p></details></section><section><h3>Caffeine through the day</h3>${chart('desktop')}${bed()}<details><summary>Explore the model</summary><p class="muted">Caffeine · Sleep · Tolerance · Alertness · Learning</p></details></section></div></div><div id="desktop-current" class="space-demo" hidden><div class="mini-phone"><b>DeCaf</b><p>Your caffeine plan</p><div class="mini-block"><div class="mini-circle">7.9</div>Alertness during your event</div><div class="mini-block"><b style="font-size:13px">Your event</b><p>Mon, Oct 19 · 9 AM</p><p>Lasts 2 h</p><p>A nap is OK</p></div><div class="mini-block">The plan ↓</div></div></div>`}
];
const descriptions=document.getElementById('description'),stage=document.getElementById('stage'),picker=document.getElementById('example');let current=0;
function drawCharts(){root.querySelectorAll('svg.chart').forEach(svg=>{const w=svg.clientWidth,h=svg.clientHeight;if(!w)return;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const left=29,right=w-10,top=22,bottom=h-30,px=t=>left+(right-left)*t,py=v=>bottom-(bottom-top)*v;const pts=svg.dataset.chart==='desktop'?[[0,0],[.13,0],[.15,.42],[.18,.67],[.21,.73],[.3,.56],[.45,.38],[.65,.23],[.82,.15],[1,.1]]:[[0,0],[.09,0],[.13,.38],[.16,.46],[.24,.39],[.34,.31],[.38,.3],[.42,.72],[.46,.79],[.55,.63],[.68,.47],[.83,.32],[1,.2]];const d=pts.map((p,i)=>`${i?'L':'M'}${px(p[0])},${py(p[1])}`).join(' ');svg.innerHTML=`<text x="${left}" y="12">mg · schematic</text>${[0,.5,1].map(v=>`<line x1="${left}" y1="${py(v)}" x2="${right}" y2="${py(v)}"/><text x="${left-6}" y="${py(v)+4}" text-anchor="end">${v*200}</text>`).join('')}<path class="curve" d="${d}"/>${['6 AM','12 PM','6 PM','12 AM'].map((s,i)=>`<text x="${px(i/3)}" y="${h-8}" text-anchor="${i===0?'start':i===3?'end':'middle'}">${s}</text>`).join('')}`;});}
function updateShared(){const value=document.getElementById('shared-date')?.value;if(!value)return;const date=new Date(value+'T12:00:00');const text=date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});const tm=document.getElementById('shared-time').value;root.querySelectorAll('.shared-date-text').forEach(x=>x.textContent=text);root.querySelectorAll('.shared-time-text').forEach(x=>x.textContent=tm?'Starts at '+tm:'Choose a start time');}
function showNav(name){const el=document.getElementById('nav-content');if(!el)return;root.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.nav===name)));el.innerHTML=name==='today'?`<h2>Today</h2><p class="subtitle">Sun, Oct 18</p><div class="receipt"><time>8 AM</time><div><strong>Drip coffee</strong><small>95 mg logged</small></div></div><div class="summary"><p><strong>80 mg</strong> estimated right now</p><small>37 mg estimated at bedtime</small></div><p class="muted">Drinks, sleep, and a quick check-in in one place.</p>`:name==='plan'?`<h2>Your event plan</h2><p class="subtitle">Mon, Oct 19 · 9–11 AM</p>${plan()}${bed()}`:`<h2>Insights</h2><p class="subtitle">Understand what shapes your plan.</p>${[['Caffeine','How each drink wears off'],['Sleep','Sleep pressure and your body clock'],['Tolerance','How daily use changes the effect'],['Alertness','How the model combines the inputs'],['Learning','What your ratings tell us']].map(([t,s])=>`<details><summary>${t}</summary><p class="muted">${s}</p></details>`).join('')}`;}
function show(i){current=Math.max(0,Math.min(pages.length-1,i));picker.value=String(current);descriptions.textContent=pages[current].description;stage.innerHTML=pages[current].render();document.getElementById('previous').disabled=current===0;document.getElementById('next').disabled=current===pages.length-1;if(current===1)showNav('today');if(current===3)updateShared();drawCharts();}
picker.addEventListener('change',()=>show(Number(picker.value)));document.getElementById('previous').addEventListener('click',()=>show(current-1));document.getElementById('next').addEventListener('click',()=>show(current+1));
root.addEventListener('input',e=>{if(e.target.id==='shared-date'||e.target.id==='shared-time')updateShared();});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)showNav(b.dataset.nav);if(b.dataset.rating){root.querySelectorAll('[data-rating]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('rating-status').textContent=`Selected ${b.dataset.rating}/5 in this preview. Nothing saved to the app.`;}if(b.dataset.desktop){const proposed=b.dataset.desktop==='proposed';document.getElementById('desktop-proposed').hidden=!proposed;document.getElementById('desktop-current').hidden=proposed;root.querySelectorAll('[data-desktop]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));drawCharts();}});
new ResizeObserver(drawCharts).observe(stage);show(0);
const requested=new URLSearchParams(location.search).get('example');if(requested!==null)show(Number(requested)||0);
window.decafPreview={show,drawCharts};
